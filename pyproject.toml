[project]
name = "master-sae-experiments"
version = "0.1.0"
description = "Feature-based RL with Sparse Autoencoders"
requires-python = ">=3.12"
dependencies = [
    # Deployment
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "websocket-client>=1.9.0",
    # ML core
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate>=0.30",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "datasets>=2.19",
    # Config / validation
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Data / stats
    "scipy>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    # Visualization
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Progress
    "tqdm>=4.66",
]

[project.scripts]
sae-experiments = "sae_experiments.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sae_experiments"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.18",
]
